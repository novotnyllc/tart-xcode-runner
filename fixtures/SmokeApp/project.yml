name: SmokeApp
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  SmokeApp:
    type: application
    platform: iOS
    sources: SmokeApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.tart.SmokeApp
        GENERATE_INFOPLIST_FILE: YES
  SmokeAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: SmokeAppUITests
    dependencies:
      - target: SmokeApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.tart.SmokeAppUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SmokeApp
